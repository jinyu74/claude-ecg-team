# 3D 인계 흐름: 히사이시(조달·리타기팅·재질) → 마크(변환·LOD·콜라이더 자동화 + 반입 검사 CI) → 이와타(엔진 반입·런타임 검수), 예산은 카맥.
@duty 마크     이 프로젝트에는 서버·API·인증이 없다 — 역할 파일의 백엔드 책임 대신 도구·빌드·콘텐츠 파이프라인을 맡는다.
@duty 마크     승인된 Blender 스크립트·에셋 변환 도구, 빌드·CI(Steam·모바일), 콘텐츠(대본·장면 데이터) 검증 도구.
@duty 마크     3D: 변환·LOD 생성·콜라이더 생성 자동화와 엔진 반입 전 자동 검사(스케일·축·명명·폴리곤·텍스처 예산)를 CI 로 돌린다.
@duty 히사이시 3D: 기존 리그·모션 조달(라이선스 확인), 리타기팅, 재질 정리까지 맡아 네이선의 인계 규격대로 마크의 변환 도구에 넘긴다.
@duty 이와타   3D: 엔진 반입·런타임 반영(애니메이션 상태·재질 연결)과 반입 검수(화면에서 리그·재질·LOD 전환·충돌 확인). 문제는 원인 단계(조달/변환)로 되돌린다.
@duty 카맥     3D: 폴리곤·텍스처·메모리·LOD 단계 예산을 정의하고 대표 장면에서 측정한다. 마크의 반입 검사 기준값은 이 예산을 쓴다.
@duty 네이선   3D: 대표 장면 착수 전에 인계 규격(파일 형식·스케일·축·명명·LOD 단계·콜라이더 규칙)을 문서로 확정한다.
@duty 제임스   3D 인원 증원(테크니컬 아티스트 등)은 대표 장면 제작에서 단계별 작업량을 확인한 뒤 사용자에게 결정 요청한다.

