# 학습 게임 팀 (15명, Claude 10 : Codex 5) — setup-team <세션> -d <작업폴더> -c edu-game
# 형식·배정 원칙: teams/README.md (8번째 열 = 멤버별 플러그인)
#
# 조직 (2026-10-02) — 결정은 사용자, 제임스는 진행자 (roles/_team-workflow.md "결정 권한")
#   [기획] 결정 페어 3쌍: 같은 역할 파일을 Claude·Codex 가 함께 쓰고 관점만 다르다 (§10)
#   [개발] 만드는 쪽 Claude, 검증하는 쪽 Codex (정민·카맥) (§11)
#   Codex 기획 페어는 effort medium 으로 시작해 team-status --limits 로 소모를 보고 조정한다 (§0.5.1).

@project <설명> 줄은 프로젝트 종류 — 멤버 정체 블록에 표시된다.

# 전용 git worktree 에서 기동할 멤버 — 브랜치·커밋이 섞이지 않게 (공통 §2.4). 문서 위주 멤버는 공유 작업 폴더.
@worktree 네이선 마크 이와타 정민 카맥 수영 히사이시

# 역할 파일이 부르지만 이 팀에 없는 멤버의 대체 담당 (공통 §8.1). 표에 없으면 제임스.
@substitute 닥터   파인만   서사·캐릭터 (학습 게임 — 내러티브 항목은 콘텐츠 페어가 맡음)
@substitute 드럭만 세이건   서사·캐릭터
@substitute 우에다 미야모토 연출·톤
# 행 순서 = 멤버 번호 (0 부터, 페인 태그 @member).
# [창이름] 줄 아래 멤버는 그 tmux 창에 배치된다. 구획이 없으면 창 'team' 하나.
#   창마다 첫 멤버는 좌측 메인 페인, 나머지는 우측 2열 그리드에 행 우선으로 배치된다.
#   행 순서를 바꾸면 페인 위치가 바뀐다 (team-send 는 이름으로 찾으므로 영향 없음).
#
# 조직 (2026-10-02 개편) — 결정은 사용자, 제임스는 진행자 (roles/_team-workflow.md "결정 권한")
#   [기획] 결정 페어 3쌍: 같은 역할 파일을 Claude·Codex 가 함께 쓰고 관점만 다르다 (§10)
#   [개발] 만드는 쪽 Claude, 검증하는 쪽 Codex (정민·카맥) (§11)
#
# 모델 배정 원칙:
#   - Claude Opus 5.5: 진행·기획 판단·설계·구현·디자인 리드
#   - Claude Sonnet 5.5 (1M): 조사·에셋처럼 반복 많고 컨텍스트 큰 작업 (수진·히사이시)
#   - Codex gpt-6.1-sol: 기획 페어의 다른 관점, 개발 검증 게이트
#   - Fable 5.1: 기본 배정 안 함 (필요 시 페인에서 /model fable)
# effort: 구현·설계는 xhigh, 기획 판단·진행·디자인은 high, 조사·에셋은 medium.
#   Codex 멤버 5명은 계정 사용 한도를 공유한다 — 기획 페어는 medium 으로 시작하고
#   team-status --limits 로 소모를 본 뒤 조정한다 (§0.5.1).

