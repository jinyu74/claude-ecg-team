# 팀 멤버 설정 — 단일 소스 (setup-team.sh · bin/team-send 가 읽음)
#
# 형식: 이름 | 역할파일 | 페인 라벨 | 엔진 | 모델 | effort | 별칭(공백 구분)
#   이름      team-send 메시지 헤더와 수신자 지정에 쓰는 대표 이름
#   역할파일  roles/<역할파일>.md (확장자 제외). 없으면 역할 미주입으로 기동
#   페인 라벨 tmux 페인 보더에 표시 (team-status 의 역할 컬럼)
#   엔진      claude | codex — 실행할 CLI
#   모델      엔진별 모델 ID (claude: claude-opus-5-5 / claude-sonnet-5-5[1m] … · codex: gpt-6.1-sol …)
#   effort    low / medium / high / xhigh / max (claude --effort · codex model_reasoning_effort)
#   별칭      team-send 수신자로 쓸 수 있는 추가 이름
#
# 행 순서 = tmux 페인 인덱스 (0 부터).
#   첫 행은 좌측 메인 페인, 나머지는 우측 2열 그리드에 행 우선으로 배치된다.
#   행 순서를 바꾸면 페인 위치가 바뀐다 (team-send 는 이름으로 찾으므로 영향 없음).
#
# 모델 배정 원칙 (2026-10-01):
#   - Opus 5.5: 의사결정·설계·구현·머지 게이트 (영향 大)
#   - Sonnet 5.5 (1M): 조사·측정처럼 반복 많고 컨텍스트 큰 작업
#   - Fable 5.1: 기본 배정 안 함 (Opus 5.5 의 2.5배 가격, 긴 턴이 페인 간 협업 병목). 필요 시 페인에서 /model fable
#   - 수영은 백엔드 프로젝트 기준. 프런트 프로젝트면 claude-opus-5-5 · high 이상으로 상향
# effort: 설계·구현·리뷰 xhigh, 오케스트레이션 high, 조사·측정·UI medium

